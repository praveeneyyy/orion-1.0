<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8A2BE2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#05070D"/>
  <circle cx="50" cy="50" r="42" fill="url(#glow)"/>
  
  <polyline points="28,26 40,46 60,46 72,26" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="1 1" opacity="0.8"/>
  <polyline points="40,46 45,52 50,52 55,52 60,46" stroke="#00F0FF" stroke-width="2" opacity="0.9"/>
  <polyline points="45,52 32,78 68,78 55,52" stroke="#8A2BE2" stroke-width="1.8" opacity="0.8"/>
  
  <circle cx="28" cy="26" r="3.8" fill="#FF7B00" filter="url(#neon)"/>
  <circle cx="72" cy="26" r="3.2" fill="#00F0FF" filter="url(#neon)"/>
  <circle cx="45" cy="52" r="2.6" fill="#FFFFFF" filter="url(#neon)"/>
  <circle cx="50" cy="52" r="2.8" fill="#00F0FF" filter="url(#neon)"/>
  <circle cx="55" cy="52" r="2.6" fill="#FFFFFF" filter="url(#neon)"/>
  <circle cx="32" cy="78" r="3.2" fill="#00F0FF" filter="url(#neon)"/>
  <circle cx="68" cy="78" r="4.2" fill="#00F0FF" filter="url(#neon)"/>
</svg>
